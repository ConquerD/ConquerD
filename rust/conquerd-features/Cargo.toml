[package]
name = "conquerd-features"
version = "1.0.0"
edition = "2021"
description = "Capability registry and feature module spine for the Conquerd peer-connectivity framework."

[lib]
name = "conquerd_features"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
toml = "0.8"

# Module signing + native loader (Phase 5)
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
libloading = "0.8"

[dev-dependencies]
rand = "0.8"
