<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presence Playground &middot; DoubleSlash Apps</title>
    <link rel="stylesheet" href="../../web-sdk/demo-shell.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <a href="/" class="brand" aria-label="Back to portal">D://</a>
        <div class="app-heading">
          <div class="eyebrow">DoubleSlash Apps</div>
          <h1>Presence Playground</h1>
        </div>
        <div class="header-actions">
          <button id="share">Copy link</button
          ><button id="focus" aria-pressed="false">Focus</button
          ><button
            id="session-toggle"
            aria-expanded="false"
            aria-controls="session-panel"
          >
            Session
          </button>
        </div>
      </header>
      <div class="session-bar">
        <span><i class="live-dot"></i><span id="room-label">lounge</span></span
        ><span id="peers-count">0 here</span
        ><span id="status" role="status">Connecting...</span
        ><button id="exit-focus">Exit focus</button>
      </div>
      <div class="work-area">
        <section class="workspace" aria-label="Presence Playground">
          <div class="toolbar">
            <span>Move together. Click to send a ripple.</span
            ><span class="spacer"></span
            ><span id="activity">Your space is live</span>
          </div>
          <div class="stage">
            <canvas
              id="canvas"
              width="800"
              height="600"
              tabindex="0"
              aria-label="Presence Playground interactive canvas"
            ></canvas>
          </div>
        </section>
        <aside
          id="session-panel"
          class="session-panel"
          hidden
          aria-label="Session and connection details"
        ></aside>
      </div>
      <footer class="app-footer">
        <span id="controls-hint"></span
        ><span class="notice" id="notice" role="status"></span
        ><span class="footer-detail">An app on your peer network</span>
      </footer>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
