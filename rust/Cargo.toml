[workspace]
members = [
    "conquerd-features",
    "conquerd-supernode",
    "conquerd-installer",
    "conquerd-opus",
    "conquerd-vpx",
]
# conquerd-client is intentionally excluded: it has its own workspace root
# (rust/conquerd-client/Cargo.toml) so the cxx-qt patch stays isolated there
# and does not affect server-side builds.
resolver = "2"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# wayland-scanner 0.31.10 (crates.io) pins quick-xml ^0.39; RUSTSEC-2026-0195 needs >=0.41.
# Thin fork until Smithay ships a release with the bumped dep.
[patch.crates-io]
wayland-scanner = { path = "patches/wayland-scanner" }
