[workspace]
resolver = "2"
members = [
    "crates/snm-cli",
    "crates/snm-core",
    "crates/snm-transport",
    "crates/snm-supernode",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/conquerd/supernode-manager"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

snm-core = { path = "crates/snm-core" }
snm-transport = { path = "crates/snm-transport" }
snm-supernode = { path = "crates/snm-supernode" }
