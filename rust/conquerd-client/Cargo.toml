[package]
name = "conquerd-client"
version = "1.0.0"
edition = "2021"
description = "Native Rust desktop client for the Conquerd peer-connectivity framework."

[[bin]]
name = "conquerd-client"
path = "src/main.rs"

[dependencies]
# Internal crates (rlib, no PyO3 boundary)
conquerd-features = { path = "../conquerd-features" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "signal"] }

# WebSocket signaling
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# QUIC transport
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.13"

# Crypto (mirrors what conquerd-crypto uses internally)
ed25519-dalek = { version = "2", features = ["rand_core", "pem", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default parser is not round-trip-accurate for
# f64, so a signed message's timestamp could shift by 1 ULP on `from_json`,
# changing `canonical_bytes()` on the receiver and breaking Ed25519 signature
# verification (~10% of high-precision timestamps). This makes the parser
# bit-exact so re-canonicalized signatures always match. The supernode gets the
# same guarantee via serde_json's `arbitrary_precision`.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Utilities
base64 = "0.22"
hex = "0.4"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
dirs = "5"

# SQLite (chat store)
rusqlite = { version = "0.31", features = ["bundled"] }

# Audio pipeline (CPAL I/O + Opus codec + lock-free ring buffer)
cpal = "0.15"
conquerd-opus = { path = "../conquerd-opus" }
ringbuf = "0.4"

# VP8 video codec (vendored libvpx). Present on every platform, because it is
# the only codec a Windows peer and a Linux peer can both run — Windows and
# macOS have OS-licensed H.264, Linux has nothing equivalent.
conquerd-vpx = { path = "../conquerd-vpx" }

# Ringtone playback (OGG/Vorbis via rodio)
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }

# HTTP client (GitHub updater, ollama)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# UPnP port mapping (optional — graceful fallback when no gateway)
rupnp = { version = "1", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Clipboard access (invite link copy)
arboard = { version = "3", default-features = false }

# Linux camera capture (Video4Linux2).
#
# The crate rather than raw ioctls: V4L2's structs are large, contain unions,
# and differ in layout between x86_64 and aarch64 — both of which are release
# targets, and only one of which can be tested here. Getting a layout wrong
# yields corrupt frames rather than a compile error.
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

# Windows taskbar overlay badge (unread count)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    # Lets us implement COM interfaces in Rust, not just call them. Needed for
    # IMFAsyncCallback: hardware (asynchronous) Media Foundation transforms
    # deliver METransformNeedInput / METransformHaveOutput only through
    # BeginGetEvent + a callback, so without this there is no way to drive them.
    "implement",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
    # Media Foundation: hardware-accelerated H.264 encode/decode. The hardware
    # MFT enumeration path picks up NVENC / QuickSync / AMF automatically, and
    # the OS holds the AVC licence so there is no MPEG-LA exposure of our own.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    # Screen / window / game capture. Windows.Graphics.Capture is the only
    # Windows API that covers all three: Desktop Duplication is monitors-only
    # and does not survive fullscreen-exclusive games, and GDI BitBlt cannot
    # see hardware-accelerated content at all.
    #
    # WGC hands back D3D11 textures, hence the Direct3D/DXGI entries: the frame
    # has to be copied to a CPU-readable staging texture before it can be
    # converted to I420 for the encoder.
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_HiDpi",
    # DwmGetWindowAttribute, to skip "cloaked" windows — suspended UWP apps sit
    # in the window list but capture as solid black.
    "Win32_Graphics_Dwm",
] }
# The `#[implement]` macro expands to `windows_core::…` paths, so the crate has
# to be nameable directly rather than only via `windows::core`.
windows-core = "0.58"

[build-dependencies]
# Only needed when `qt-ui` feature is active; always listed here because
# build-dependencies cannot be made optional via features.
cxx-qt-build = { version = "0.8", optional = false }
# Windows PE resource metadata (ProductName, Version, etc.) for code signing.
winresource = "0.1"
# C++ compilation for the scheme handler shim (webengine feature).
cc = "1"
# For computing a content hash of source files for stronger build attestation.
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros"] }
tempfile = "3"

[features]
# Enable this when Qt6 is installed and QTDIR is set.
# Activates the cxx-qt bridge and QML UI layer.
qt-ui = ["dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx"]
# Enable Qt WebEngine (Chromium embed) for inline YouTube, file preview,
# and the node browser panel. Requires Qt WebEngine to be installed via
# the Qt Maintenance Tool (separate optional Qt component).
# Build: cargo build --features qt-ui,webengine
webengine = ["qt-ui"]
# Keep the Windows console window attached (for log output while debugging).
# Default: console is suppressed in production builds.
console = []
# Manual developer diagnostics (live profile dump). Not compiled in CI/default test runs.
manual-diagnostics = []
# Type-check and lint the macOS-only capture code from a non-macOS host.
#
# Nobody on the team develops on a Mac, so without this the macOS backend's
# only feedback is a CI run — and a lint that fires solely under
# `cfg(target_os = "macos")` is invisible until then. The module is pure Rust
# over an `extern "C"` block, and `cargo clippy` type-checks without linking, so
# any host can compile it; only the Objective-C half genuinely needs a Mac.
#
#   cargo clippy -p conquerd-client --no-default-features \
#       --features lint-macos -- -D warnings
#
# Never enable this for a real build: the module's `extern` symbols only exist
# when `macos_camera.m` is compiled, so linking would fail.
lint-macos = []
# Experimental acoustic echo cancellation on the capture path (pure-Rust NLMS,
# no extra dependencies). Off by default; the canceller compiles either way (so
# its DSP unit tests always run) but is only activated at runtime when enabled.
# Build: cargo build --features qt-ui,aec
aec = []

[dependencies.cxx]
version = "1"
optional = true

[dependencies.cxx-qt]
version = "0.8"
optional = true

[dependencies.cxx-qt-lib]
version = "0.8"
optional = true
features = ["qt_gui", "qt_qml"]

# ── Workspace (client is its own workspace so cxx-qt patch is isolated here) ──
# This keeps the server-side workspace (rust/Cargo.toml) free of Qt/cxx-qt,
# allowing conquerd-supernode to be built on Linux without Qt.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace]

# NOTE: If your local Rust toolchain triggers cxx-qt macro errors (e.g. the
# "non-foreign item macro in foreign item position" issue on Rust ≥ 1.83),
# apply a [patch.crates-io] override pointing at your patched cxx-qt source in
# a *non-committed* local Cargo.toml layer.  The patch is intentionally NOT
# committed here because the absolute Windows paths break CI and Linux builds.
