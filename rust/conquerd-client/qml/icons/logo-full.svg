<svg class="wordmark-svg" viewBox="0 0 486 90" fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="DoubleSlash://">
  <defs>
    <!-- Gradient: white → purple, matching the site h1 -->
    <linearGradient id="wm-grad" x1="54" y1="0" x2="398" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- ════ RED LETTER: D (icon-mark pentagon, same shape as icons/logo.svg) ════ -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#FF2B40" d="
    M0,17 L36,17 L48,45 L36,73 L0,73 Z
    M11,28 L28,28 L37,45 L28,62 L11,62 Z
  "/>

  <!-- ════ GRADIENT LETTERS: o u b l e S l a s h ════ -->
  <g fill="url(#wm-grad)">

    <!-- o — angular hexagon bowl, x-height. -->
    <g transform="translate(54,0)">
      <path fill-rule="evenodd" d="
        M12,33 L24,33 L36,53 L24,73 L12,73 L0,53 Z
        M15,42 L21,42 L29,53 L21,64 L15,64 L7,53 Z
      "/>
    </g>

    <!-- u — two vertical bars joined by an angled bottom. -->
    <g transform="translate(96,0)">
      <path d="M0,33 L11,33 L11,58 L23,66 L23,33 L34,33 L34,73 L17,73 L0,58 Z"/>
    </g>

    <!-- b — ascender stem (left) + hexagon bowl (right), flat seam where they meet. -->
    <g transform="translate(136,0)">
      <path fill-rule="evenodd" d="
        M0,17 L11,17 L11,33 L24,33 L36,53 L24,73 L11,73 L0,73 Z
        M14,42 L21,42 L29,53 L21,64 L14,64 Z
      "/>
    </g>

    <!-- l — plain ascender stem. -->
    <g transform="translate(178,0)">
      <path d="M0,17 L11,17 L11,73 L0,73 Z"/>
    </g>

    <!-- e — hexagon with a horizontal crossbar gap. -->
    <g transform="translate(195,0)">
      <path d="M12,33 L36,33 L36,42 L11,42 L11,49 L33,49 L33,57 L11,57 L11,64 L36,64 L36,73 L0,73 L0,53 L12,33 Z"/>
    </g>

    <!-- S — capital, cap-height zigzag ribbon (angular, no curves). -->
    <g transform="translate(237,0)">
      <path d="
        M0,17 L30,17 L30,28 L12,28 L12,34 L30,50 L30,73 L0,73 L0,62 L18,62 L18,56 L0,40 Z
      "/>
    </g>

    <!-- l — plain ascender stem. -->
    <g transform="translate(273,0)">
      <path d="M0,17 L11,17 L11,73 L0,73 Z"/>
    </g>

    <!-- a — angular arrow-bowl (point left) with a stem seam (right), x-height. -->
    <g transform="translate(290,0)">
      <path fill-rule="evenodd" d="
        M0,53 L12,33 L36,33 L36,73 L12,73 Z
        M8,53 L16,42 L29,42 L29,64 L16,64 Z
      "/>
    </g>

    <!-- s — lowercase, x-height zigzag ribbon (same technique as S, smaller). -->
    <g transform="translate(332,0)">
      <path d="
        M0,33 L26,33 L26,43 L10,43 L10,48 L26,58 L26,73 L0,73 L0,63 L16,63 L16,58 L0,48 Z
      "/>
    </g>

    <!-- h — ascender stem (left) + angled arm/leg (right), like n with a taller stem. -->
    <g transform="translate(364,0)">
      <path d="M0,17 L11,17 L11,40 L23,33 L34,33 L34,73 L23,73 L23,44 L11,51 L11,73 L0,73 Z"/>
    </g>

  </g>

  <!-- ════ RED COLON + SLASHES (offset so the group reuses the original x346-409 layout) ════ -->
  <g transform="translate(62,0)">
    <rect x="346" y="34" width="8" height="8" rx="1" fill="#FF2B40"/>
    <rect x="346" y="58" width="8" height="8" rx="1" fill="#FF2B40"/>
    <polygon points="364,73 375,73 393,17 382,17" fill="#FF2B40"/>
    <polygon points="380,73 391,73 409,17 398,17" fill="#FF2B40"/>
  </g>
</svg>
