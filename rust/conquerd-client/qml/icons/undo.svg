<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <!-- 180-degree U-turn body: enter top-right, loop left and down, exit bottom-right -->
  <polyline points="16,7 5,7 5,13 16,13" stroke="#C8C8C8" stroke-width="1.5" stroke-linejoin="miter"/>
  <!-- Arrowhead at exit (bottom-right) pointing right -->
  <polyline points="13,10 16,13 13,16" stroke="#C8C8C8" stroke-width="1.5" stroke-linejoin="miter"/>
</svg>
