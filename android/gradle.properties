org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Which ABIs cargo-ndk builds. arm64-v8a covers every current phone; add
# x86_64 when you need the emulator, at the cost of a second full Rust build
# of the client core (libopus and libvpx included).
conquerd.abis=arm64-v8a

# Minimum API the Rust side is compiled against. Must match minSdk below —
# cargo-ndk bakes it into the clang target triple, so a mismatch produces a
# library that dlopen refuses on older devices with no useful diagnostic.
conquerd.ndkApi=26
