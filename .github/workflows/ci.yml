  # macOS is the one platform with no local development machine on the team, so
  # this job exists to keep the AVFoundation capture path and the vendored VP8
  # build from bit-rotting unnoticed. It compiles and runs the headless tests;
  # it cannot exercise a camera (no hardware, and Screen Recording / Camera TCC
  # consent cannot be granted to a CI runner).
  test-macos:
    name: Rust tests (macOS, non-Qt)
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/conquerd-client/target
          key: macos-cargo-ci-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: rust/conquerd-opus/opus/dnn
          key: opus-dnn-${{ hashFiles('scripts/fetch_opus_weights.sh') }}

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      # The VP8 build shells out to libvpx's rtcd.pl; macOS ships perl in base,
      # but assert it rather than discovering its absence as a C compile error.
      - name: Verify perl is available (vendored libvpx codegen)
        run: perl --version

      - name: Build vendored VP8 (conquerd-vpx)
        run: cargo test -p conquerd-vpx
        working-directory: rust

      - name: Test client workspace (headless, no qt-ui)
        run: cargo test
        working-directory: rust/conquerd-client

      - name: Clippy (client workspace, headless)
        run: cargo clippy -p conquerd-client --no-default-features -- -D warnings
        working-directory: rust/conquerd-client
