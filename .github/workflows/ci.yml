  test-linux-arm64:
    name: Supernode build (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
