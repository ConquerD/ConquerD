name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/conquerd-client/target
          key: linux-cargo-ci-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev libdbus-1-dev

      - name: Verify version metadata stays in sync
        run: pwsh scripts/check_version_sync.ps1

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      # --- Lint (fail fast) -------------------------------------------------
      - name: Check formatting (rust/ workspace)
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy (rust/ workspace, deny warnings)
        run: cargo clippy --all -- -D warnings
        working-directory: rust

      - name: Release manifest signer self-test
        run: cargo run -p conquerd-installer --bin sign-release-manifest -- --self-test
        working-directory: rust

      # --- Tests ------------------------------------------------------------
      - name: Run Rust tests (rust/ workspace)
        working-directory: rust
        run: cargo test --all --release

      - name: Test client workspace (headless, no qt-ui feature)
        working-directory: rust/conquerd-client
        run: cargo test

      # Client workspace also needs its own fmt/clippy pass (separate Cargo workspace)
      - name: Check formatting (client workspace)
        run: cargo fmt --all -- --check
        working-directory: rust/conquerd-client

      - name: Clippy (client workspace, headless)
        run: cargo clippy -p conquerd-client --no-default-features -- -D warnings
        working-directory: rust/conquerd-client

      # --- Security ---------------------------------------------------------
      # Lockfiles live under rust/ (two separate Cargo workspaces, not repo root).
      - name: Security audit (rust workspace)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2 (pinned)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

      - name: Security audit (client workspace)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2 (pinned)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust/conquerd-client

  test-windows:
    name: Rust tests (Windows, non-Qt)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/conquerd-client/target
          key: windows-cargo-ci-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Verify version metadata stays in sync
        shell: pwsh
        run: pwsh scripts/check_version_sync.ps1

      - name: Fetch Opus DNN model weights
        shell: pwsh
        run: pwsh scripts/fetch_opus_weights.ps1

      - name: Check formatting (rust/ workspace)
        shell: pwsh
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy (rust/ workspace, deny warnings)
        shell: pwsh
        run: cargo clippy --all -- -D warnings
        working-directory: rust

      - name: Release manifest signer self-test
        shell: pwsh
        run: cargo run -p conquerd-installer --bin sign-release-manifest -- --self-test
        working-directory: rust

      - name: Run Rust tests (rust/ workspace, non-Qt)
        shell: pwsh
        run: cargo test --all --release
        working-directory: rust

      - name: Test client workspace (headless, no qt-ui)
        shell: pwsh
        run: cargo test
        working-directory: rust/conquerd-client

      - name: Clippy (client workspace, headless)
        shell: pwsh
        run: cargo clippy -p conquerd-client --no-default-features -- -D warnings
        working-directory: rust/conquerd-client

