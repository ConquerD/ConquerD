# Local mirror: scripts/ci_local.ps1 (Windows) / scripts/ci_local.sh (Linux/macOS)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_TOOLCHAIN: "1.89.0"
  # Pinned so CI never builds "latest" cargo-audit, whose MSRV can outrun the
  # pinned toolchain (rustsec/audit-check did exactly that). Known-good on 1.89.
  CARGO_AUDIT_VERSION: "0.22.1"

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            rust/conquerd-client/target
          key: linux-cargo-ci-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev libdbus-1-dev libclang-dev

      - name: Verify version metadata stays in sync
        run: pwsh scripts/check_version_sync.ps1

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            rust/conquerd-opus/opus/dnn/lace_data.c
            rust/conquerd-opus/opus/dnn/lace_data.h
            rust/conquerd-opus/opus/dnn/nolace_data.c
            rust/conquerd-opus/opus/dnn/nolace_data.h
            rust/conquerd-opus/opus/dnn/fargan_data.c
            rust/conquerd-opus/opus/dnn/fargan_data.h
            rust/conquerd-opus/opus/dnn/pitchdnn_data.c
            rust/conquerd-opus/opus/dnn/pitchdnn_data.h
            rust/conquerd-opus/opus/dnn/plc_data.c
            rust/conquerd-opus/opus/dnn/plc_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_constants.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.h
            rust/conquerd-opus/opus/dnn/bbwenet_data.c
            rust/conquerd-opus/opus/dnn/bbwenet_data.h
            rust/conquerd-opus/opus/dnn/lossgen_data.c
            rust/conquerd-opus/opus/dnn/lossgen_data.h
            rust/conquerd-opus/opus/dnn/models
          key: opus-dnn-tarlist-a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      # --- Lint (fail fast) -------------------------------------------------
      - name: Check formatting (rust/ workspace)
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy (rust/ workspace, deny warnings)
        run: cargo clippy --all -- -D warnings
        working-directory: rust

      - name: Release manifest signer self-test
        run: cargo run -p conquerd-installer --bin sign-release-manifest -- --self-test
        working-directory: rust

      # --- Tests ------------------------------------------------------------
      - name: Run Rust tests (rust/ workspace)
        working-directory: rust
        run: cargo test --all --release

      - name: Test client workspace (headless, no qt-ui feature)
        working-directory: rust/conquerd-client
        run: cargo test

      # Client workspace also needs its own fmt/clippy pass (separate Cargo workspace)
      - name: Check formatting (client workspace)
        run: cargo fmt --all -- --check
        working-directory: rust/conquerd-client

      - name: Clippy (client workspace, headless)
        run: cargo clippy -p conquerd-client --no-default-features -- -D warnings
        working-directory: rust/conquerd-client

      # --- Security ---------------------------------------------------------
      # Lockfiles live under rust/ (two separate Cargo workspaces, not repo root).
      # The RUSTSEC-2024-0436 ignore (macOS-only wgpu-hal→metal `paste`) lives
      # in rust/.cargo/audit.toml and is picked up automatically.
      - name: Cache cargo-audit binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: linux-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        # Skip the build when the cached binary already reports the pinned
        # version (cargo install would rebuild — ~/.cargo/.crates.toml is not
        # part of the cache).
        run: |
          cargo-audit --version 2>/dev/null | grep -qF "$CARGO_AUDIT_VERSION" \
            || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Security audit (rust workspace)
        run: cargo audit --file Cargo.lock
        working-directory: rust

      - name: Security audit (client workspace)
        run: cargo audit --file Cargo.lock
        working-directory: rust/conquerd-client

  # Line/region coverage % via cargo-llvm-cov (report-only; raise floors later).
  # High-ROI packages: features + supernode + headless client. See scripts/coverage.sh.
  coverage:
    name: Rust coverage %
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
            rust/conquerd-client/target
          key: linux-cargo-cov-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev libdbus-1-dev libclang-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            rust/conquerd-opus/opus/dnn/lace_data.c
            rust/conquerd-opus/opus/dnn/lace_data.h
            rust/conquerd-opus/opus/dnn/nolace_data.c
            rust/conquerd-opus/opus/dnn/nolace_data.h
            rust/conquerd-opus/opus/dnn/fargan_data.c
            rust/conquerd-opus/opus/dnn/fargan_data.h
            rust/conquerd-opus/opus/dnn/pitchdnn_data.c
            rust/conquerd-opus/opus/dnn/pitchdnn_data.h
            rust/conquerd-opus/opus/dnn/plc_data.c
            rust/conquerd-opus/opus/dnn/plc_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_constants.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.h
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.h
            rust/conquerd-opus/opus/dnn/bbwenet_data.c
            rust/conquerd-opus/opus/dnn/bbwenet_data.h
            rust/conquerd-opus/opus/dnn/lossgen_data.c
            rust/conquerd-opus/opus/dnn/lossgen_data.h
            rust/conquerd-opus/opus/dnn/models
          key: opus-dnn-tarlist-a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      - name: Run coverage (hot packages)
        run: bash scripts/coverage.sh --scope hot --skip-install

      - name: Publish summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage/summary.md produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload LCOV + JSON artifacts
        if: always()
        # v7 runs on Node 24 (v4 targets Node 20, which GH Actions now forces
        # onto 24 and annotates as deprecated). Keep the pin aligned with release.yml.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: |
            coverage/
          if-no-files-found: warn
          retention-days: 14

