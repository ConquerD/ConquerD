# ============================================================================
# release.yml — Build, sign, and publish ConquerD for all platforms
# ============================================================================
# Triggers:
#   - Tags (v*) → full signed release (draft)
#   - Push to develop or daily schedule → nightly/dev build (prerelease "nightly" tag, unsigned manifest)
#   - workflow_dispatch for manual runs
#
# Builds ConquerD for Windows, macOS, and Linux, applies code signing (when configured),
# then creates GitHub Releases with the 7z/dmg/AppImage + standalone installer + manifest.
#
# Code Signing Setup:
#
#   Windows (SignPath.io — free for open source):
#     1. Apply at https://signpath.org/ with your OSS project
#     2. Configure a signing policy in SignPath dashboard
#     3. Add these repository secrets:
#        - SIGNPATH_API_TOKEN: Your SignPath API token
#     4. Set these repository variables:
#        - SIGNPATH_ORGANIZATION_ID: Your org ID from SignPath
#        - SIGNPATH_SIGNING_POLICY_SLUG: e.g. "release-signing"
#        - SIGNPATH_PROJECT_SLUG: e.g. "conquerd"
#
#   macOS (Apple Developer Program — $99/yr, no free option):
#     1. Enroll at https://developer.apple.com/programs/
#     2. Create a "Developer ID Application" certificate
#     3. Create an App Store Connect API key for notarization
#     4. Add these repository secrets:
#        - APPLE_CERTIFICATE_P12: Base64-encoded .p12 certificate
#        - APPLE_CERTIFICATE_PASSWORD: Password for the .p12
#        - APPLE_TEAM_ID: Your 10-char team ID
#        - APPLE_NOTARY_ISSUER: App Store Connect API issuer UUID
#        - APPLE_NOTARY_KEY_ID: API key ID
#        - APPLE_NOTARY_KEY: Base64-encoded .p8 private key
#
#   Linux: No code signing required. Optional GPG signatures.
#
# Automated manifest signing (Ed25519 for releases_manifest.json):
#   Until you have a code-signing certificate (SignPath etc.), the workflow can
#   automatically generate the manifest with real build_hash + build_id from
#   the artifacts and sign it using your project Ed25519 private key.
#
#   Option A — Repository secret (simpler):
#     - Settings → Secrets and variables → Actions → New repository secret
#     - Name: RELEASE_SIGNER_PRIVATE_PEM
#     - Value: full content of your .pem file (BEGIN ... END lines included)
#
#   Option B — Environment secret (recommended — allows protection rules, required reviewers, etc.):
#     - Settings → Environments → New environment (e.g. name it "release")
#     - Add secret: RELEASE_SIGNER_PRIVATE_PEM (same value as above)
#     - Then declare the environment on the publish-release job below.
#
#   The workflow only uses the secret in the publish step and never logs it.
#   The signed releases_manifest.json is attached to the release.
#
#   When you later get binary code signing, you can still keep using this for the
#   manifest (or switch back to manual pre-signed commit if preferred).
#
# Development Nightlies:
#   - Triggered by push to `develop` or daily cron schedule.
#   - Produces "nightly" prerelease on GitHub (tag `nightly`, updated in place).
#   - Binaries use CONQUERD_BUILD_ID = nightly-<sha>-<run>
#   - Manifest is generated unsigned (for dev use; the updater will still work with sha256 fallback).
#   - No environment protection / signing key required.
#
# ============================================================================

name: Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  schedule:
    # Nightly build from develop branch (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  preflight:
    name: Release preflight checks
    runs-on: ubuntu-22.04
    # Only run the strict preflight (key placeholder + committed manifest verify) for tagged releases.
    # Nightly/dev builds on develop skip this or run a lighter version.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Reject all-zero RELEASE_SIGNER_PUBKEY_HEX placeholder (safety net)
        run: |
          PLACEHOLDER=$(printf '%064d' 0)
          if grep -q "$PLACEHOLDER" rust/conquerd-installer/src/release_manifest.rs; then
            echo "ERROR: all-zero RELEASE_SIGNER_PUBKEY_HEX placeholder found in conquerd-installer/src/release_manifest.rs"
            echo "A real Ed25519 public key must be configured before releasing."
            exit 1
          fi
          echo "OK: RELEASE_SIGNER_PUBKEY_HEX appears to be a real key."

      - name: Install Rust toolchain (for signed manifest verification in preflight)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)

      - name: Verify releases_manifest.json (if present in the tag tree) using the in-tree signer
        run: |
          if [ -f releases_manifest.json ]; then
            echo "Found releases_manifest.json — running strict signature verification..."
            cargo run -p conquerd-installer --manifest-path rust/Cargo.toml --bin sign-release-manifest -- --verify -i releases_manifest.json
          else
            echo "No releases_manifest.json present in this checkout."
            echo "For the first release you may add+sign it together with the tag (or upload manually to the draft release)."
            echo "Subsequent releases should commit the signed manifest before tagging so this check enforces it."
          fi

  build-windows:
    # preflight is only required for tagged releases. Develop/nightly builds run independently.
    runs-on: windows-2022
    env:
      RELEASE_SIGNER_PRIVATE_PEM: ${{ secrets.RELEASE_SIGNER_PRIVATE_PEM }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For scheduled nightlies, force checkout of develop (schedule runs on default branch).
          # For push to develop or tags, use the event ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: windows-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            rust/conquerd-opus/opus/dnn/lace_data.c
            rust/conquerd-opus/opus/dnn/nolace_data.c
            rust/conquerd-opus/opus/dnn/fargan_data.c
            rust/conquerd-opus/opus/dnn/pitchdnn_data.c
            rust/conquerd-opus/opus/dnn/plc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.c
            rust/conquerd-opus/opus/dnn/bbwenet_data.c
            rust/conquerd-opus/opus/dnn/lossgen_data.c
            rust/conquerd-opus/opus/dnn/models
          key: opus-dnn-a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

      - name: Fetch Opus DNN model weights
        shell: pwsh
        run: pwsh scripts/fetch_opus_weights.ps1

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Install Qt 6 (base + WebEngine for in-app supernode portal)
        shell: pwsh
        run: pwsh scripts/install_qt_windows.ps1

      - name: Set build metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
            $sha = "${{ github.sha }}".Substring(0, 12)
            "build_id=release-${ver}-${sha}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $sha = "${{ github.sha }}".Substring(0, 12)
            "build_id=nightly-${sha}-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Prepare release signer key (for build attestation)
        if: env.RELEASE_SIGNER_PRIVATE_PEM != ''
        shell: pwsh
        env:
          PEM: ${{ env.RELEASE_SIGNER_PRIVATE_PEM }}
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\release-signer-private.pem" -Value $env:PEM
          "CONQUERD_RELEASE_SIGN_KEY=$env:RUNNER_TEMP\release-signer-private.pem" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (build_win64.ps1)
        shell: pwsh
        env:
          # Tagged: release-X.Y.Z-<12-char sha> (matches local tag checkout in build.rs)
          # Nightly: nightly-<12-char sha>-<run>
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: .\build_win64.ps1

      - name: Copy installer for separate upload
        shell: pwsh
        run: Copy-Item "dist\ConquerD\conquerd-installer.exe" "dist\conquerd-installer.exe"

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "dist\ConquerD-*-win64.7z" -ErrorAction SilentlyContinue)) {
            throw "Release archive not found in dist/"
          }
          if (-not (Test-Path "dist\conquerd-installer.exe")) {
            throw "conquerd-installer.exe not found in dist/"
          }
          $bundle = "dist\ConquerD"
          if (-not (Test-Path "$bundle\Qt6WebEngineCore.dll")) {
            throw "Qt6WebEngineCore.dll missing from $bundle — nightly portal will not load"
          }
          if (-not (Test-Path "$bundle\resources\qtwebengine_resources.pak")) {
            throw "WebEngine resources missing from $bundle — portal pages will fail to render"
          }
          if (-not (Test-Path "$bundle\Qt6Multimedia.dll")) {
            throw "Qt6Multimedia.dll missing from $bundle — video tiles will not render"
          }
          if (-not (Test-Path "$bundle\qml\QtMultimedia")) {
            throw "QtMultimedia QML module missing from $bundle — 'import QtMultimedia' fails at parse time"
          }

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned
          path: |
            dist/ConquerD-*-win64.7z
            dist/ConquerD-*-win64.7z.sha256
            dist/conquerd-installer.exe

  sign-windows:
    needs: build-windows
    runs-on: ubuntu-22.04
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    steps:
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@4f13d373e8f0cd8d3c0465ff4877feff27aed2ae # v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: "release-artifact"
          github-artifact-id: windows-unsigned
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Recompute checksum after SignPath signing
        run: |
          cd signed
          ARCHIVE=$(ls ConquerD-*-win64.7z | head -1)
          sha256sum "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          sha256sum -c "${ARCHIVE}.sha256"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: signed/

  windows-unsigned-fallback:
    needs: build-windows
    runs-on: ubuntu-22.04
    if: vars.SIGNPATH_ORGANIZATION_ID == ''
    steps:
      - name: Download unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-unsigned
          path: artifacts/

      - name: Verify unsigned archive checksum
        run: |
          cd artifacts
          sha256sum -c ConquerD-*-win64.7z.sha256

      - name: Upload as windows-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: artifacts/

  build-macos:
    # preflight is only required for tagged releases. Develop/nightly builds run independently.
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For scheduled nightlies, force checkout of develop (schedule runs on default branch).
          # For push to develop or tags, use the event ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: macos-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            rust/conquerd-opus/opus/dnn/lace_data.c
            rust/conquerd-opus/opus/dnn/nolace_data.c
            rust/conquerd-opus/opus/dnn/fargan_data.c
            rust/conquerd-opus/opus/dnn/pitchdnn_data.c
            rust/conquerd-opus/opus/dnn/plc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.c
            rust/conquerd-opus/opus/dnn/bbwenet_data.c
            rust/conquerd-opus/opus/dnn/lossgen_data.c
            rust/conquerd-opus/opus/dnn/models
          key: opus-dnn-a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      - name: Install system deps
        run: brew install cmake create-dmg

      - name: Install Qt 6
        run: |
          pip install aqtinstall
          aqt install-qt mac desktop 6.8.3 clang_64 -m qtmultimedia -O ~/Qt
          echo "QT_DIR=$HOME/Qt/6.8.3/macos" >> "$GITHUB_ENV"

      - name: Import Apple certificate
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_CERTIFICATE_PASSWORD != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Set build metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=release-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=nightly-${SHORT_SHA}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (build_macos.sh)
        env:
          CONQUERD_RELEASE: "1"
          CONQUERD_SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: bash build_macos.sh

      - name: Notarize DMG
        if: env.APPLE_NOTARY_KEY != '' && env.APPLE_NOTARY_KEY_ID != '' && env.APPLE_NOTARY_ISSUER != ''
        run: |
          VERSION=$(grep -m1 '^version' rust/conquerd-client/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          DMG="dist/ConquerD-${VERSION}-macos-arm64.dmg"
          KEY_PATH=$RUNNER_TEMP/notary-key.p8
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY_PATH"
          xcrun notarytool submit "$DMG" --key "$KEY_PATH" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
          xcrun stapler staple "$DMG"

      - name: Generate and verify SHA-256
        run: |
          VERSION=$(grep -m1 '^version' rust/conquerd-client/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          FILE="dist/ConquerD-${VERSION}-macos-arm64.dmg"
          shasum -a 256 "$FILE" > "${FILE}.sha256"
          shasum -a 256 -c "${FILE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            dist/ConquerD-*-macos-arm64.dmg
            dist/ConquerD-*-macos-arm64.dmg.sha256

  build-linux:
    # preflight is only required for tagged releases. Develop/nightly builds run independently.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # For scheduled nightlies, force checkout of develop (schedule runs on default branch).
          # For push to develop or tags, use the event ref.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: linux-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}-${{ hashFiles('rust/conquerd-client/Cargo.lock') }}

      - name: Cache Opus DNN model weights
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            rust/conquerd-opus/opus/dnn/lace_data.c
            rust/conquerd-opus/opus/dnn/nolace_data.c
            rust/conquerd-opus/opus/dnn/fargan_data.c
            rust/conquerd-opus/opus/dnn/pitchdnn_data.c
            rust/conquerd-opus/opus/dnn/plc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_enc_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_dec_data.c
            rust/conquerd-opus/opus/dnn/dred_rdovae_stats_data.c
            rust/conquerd-opus/opus/dnn/bbwenet_data.c
            rust/conquerd-opus/opus/dnn/lossgen_data.c
            rust/conquerd-opus/opus/dnn/models
          key: opus-dnn-a5177ec6fb7d15058e99e57029746100121f68e4890b1467d4094aa336b6013e

      - name: Fetch Opus DNN model weights
        run: bash scripts/fetch_opus_weights.sh

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config fuse libfuse2 \
            libgl-dev libxkbcommon-dev libdbus-1-dev libpulse-dev \
            libasound2-dev libminiupnpc-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0

      - name: Install Qt 6
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia -O /opt/Qt
          echo "QT_DIR=/opt/Qt/6.8.3/gcc_64" >> "$GITHUB_ENV"

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Set build metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=release-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=nightly-${SHORT_SHA}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (build_linux.sh)
        env:
          CONQUERD_RELEASE: "1"
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: bash build_linux.sh

      - name: Verify artifacts
        run: |
          ls dist/ConquerD-*-x86_64.AppImage
          ls dist/ConquerD-*-x86_64.AppImage.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            dist/ConquerD-*-x86_64.AppImage
            dist/ConquerD-*-x86_64.AppImage.sha256

  build-supernode-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: supernode-linux-arm64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set build metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=release-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=nightly-${SHORT_SHA}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package supernode (linux-aarch64)
        env:
          CONQUERD_RELEASE: "1"
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: bash scripts/build_supernode.sh

      - name: Verify artifacts
        run: |
          ls dist/conquerd-supernode-*-linux-aarch64.tar.gz
          ls dist/conquerd-supernode-*-linux-aarch64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supernode-linux-arm64-release
          path: |
            dist/conquerd-supernode-*-linux-aarch64.tar.gz
            dist/conquerd-supernode-*-linux-aarch64.tar.gz.sha256

  build-supernode-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: supernode-linux-x86_64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set build metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=release-${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA:0:12}"
            echo "build_id=nightly-${SHORT_SHA}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package supernode (linux-x86_64)
        env:
          CONQUERD_RELEASE: "1"
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: bash scripts/build_supernode.sh

      - name: Verify artifacts
        run: |
          ls dist/conquerd-supernode-*-linux-x86_64.tar.gz
          ls dist/conquerd-supernode-*-linux-x86_64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supernode-linux-x86_64-release
          path: |
            dist/conquerd-supernode-*-linux-x86_64.tar.gz
            dist/conquerd-supernode-*-linux-x86_64.tar.gz.sha256

  build-supernode-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: supernode-win64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Set build metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $ver = "${{ github.ref_name }}" -replace '^v',''
            $sha = "${{ github.sha }}".Substring(0, 12)
            "build_id=release-${ver}-${sha}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $sha = "${{ github.sha }}".Substring(0, 12)
            "build_id=nightly-${sha}-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build and package supernode (win64)
        shell: pwsh
        env:
          CONQUERD_RELEASE: "1"
          CONQUERD_BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: pwsh scripts/build_supernode.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "dist\conquerd-supernode-*-win64.zip" -ErrorAction SilentlyContinue)) {
            throw "Supernode zip not found in dist/"
          }
          if (-not (Get-ChildItem "dist\conquerd-supernode-*-win64.zip.sha256" -ErrorAction SilentlyContinue)) {
            throw "Supernode zip checksum not found in dist/"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supernode-win64-release
          path: |
            dist/conquerd-supernode-*-win64.zip
            dist/conquerd-supernode-*-win64.zip.sha256

  attest:
    needs: [build-macos, build-linux, sign-windows, windows-unsigned-fallback]
    # Only run artifact attestations for official tagged releases.
    # For develop nightlies we skip this job entirely.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && ( !failure() && !cancelled() )
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: artifacts
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/ConquerD-*-win64.7z
            artifacts/conquerd-installer.exe
            artifacts/ConquerD-*-macos-arm64.dmg
            artifacts/ConquerD-*-x86_64.AppImage

  publish-release:
    needs: [attest, build-supernode-linux-arm64, build-supernode-linux-x86_64, build-supernode-windows]
    runs-on: ubuntu-22.04
    # Only for official tagged releases (v*). Nightly/dev builds on develop use publish-nightly instead.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # If you put RELEASE_SIGNER_PRIVATE_PEM in an environment secret,
    # declare the environment name here (must match what you created in Settings → Environments).
    # This makes the environment's secrets (including the private key) available to the job.
    # Common names: "release", "production", or "github-pages".
    # IMPORTANT: Change "release" below to the exact name of the environment
    # you created if it is different (e.g. "production", "github-release", etc.).
    environment: release
    env:
      RELEASE_SIGNER_PRIVATE_PEM: ${{ secrets.RELEASE_SIGNER_PRIVATE_PEM }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-release"
          path: artifacts
          merge-multiple: true

      - name: Flatten supernode artifacts into release bundle
        run: |
          set -euo pipefail
          find artifacts -type f \( \
            -name 'conquerd-supernode-*-linux-aarch64.tar.gz*' -o \
            -name 'conquerd-supernode-*-linux-x86_64.tar.gz*' -o \
            -name 'conquerd-supernode-*-win64.zip*' \
            \) -exec cp -f {} artifacts/ \;
          find artifacts -type d -empty -delete 2>/dev/null || true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Remove any pre-existing manifest from checkout (we will (re)generate if secret present)
        run: rm -f releases_manifest.json || true

      - name: Setup Rust (for manifest signer)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)

      - name: Prepare release signer private key (from secret)
        if: env.RELEASE_SIGNER_PRIVATE_PEM != ''
        env:
          PEM: ${{ env.RELEASE_SIGNER_PRIVATE_PEM }}
        run: |
          printf '%s\n' "$PEM" > /tmp/release-signer-private.pem
          chmod 600 /tmp/release-signer-private.pem
          echo "Private key prepared (size: $(stat -c%s /tmp/release-signer-private.pem) bytes)"

      - name: Generate, populate and sign releases_manifest.json (using project key)
        if: env.RELEASE_SIGNER_PRIVATE_PEM != ''
        run: |
          set -euo pipefail

          echo "==> Generating unsigned skeleton..."
          cargo run -p conquerd-installer --manifest-path rust/Cargo.toml --bin sign-release-manifest -- \
            --generate-unsigned -o /tmp/unsigned.json

          echo "==> Locating build artifacts and hashes..."
          # Hash the actual release archives (post-signing for Windows when SignPath ran).
          WIN_FILE=$(find artifacts -name '*win64.7z' ! -name '*.sha256' | head -1 || true)
          WIN_HASH=$( [ -n "$WIN_FILE" ] && sha256sum "$WIN_FILE" | awk '{print tolower($1)}' || echo "" )

          MAC_FILE=$(find artifacts -name '*macos-arm64.dmg' ! -name '*.sha256' | head -1 || true)
          MAC_HASH=$( [ -n "$MAC_FILE" ] && sha256sum "$MAC_FILE" | awk '{print tolower($1)}' || echo "" )

          LIN_FILE=$(find artifacts -name '*x86_64.AppImage' ! -name '*.sha256' | head -1 || true)
          LIN_HASH=$( [ -n "$LIN_FILE" ] && sha256sum "$LIN_FILE" | awk '{print tolower($1)}' || echo "" )

          VERSION="${GITHUB_REF_NAME#v}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          BUILD_ID="release-${VERSION}-${SHORT_SHA}"

          if [ -z "$WIN_HASH" ] || [ -z "$MAC_HASH" ] || [ -z "$LIN_HASH" ]; then
            echo "ERROR: one or more platform archive hashes are empty."
            echo "  WIN_HASH=$WIN_HASH  MAC_HASH=$MAC_HASH  LIN_HASH=$LIN_HASH"
            exit 1
          fi

          echo "    VERSION=$VERSION"
          echo "    BUILD_ID=$BUILD_ID"
          echo "    WIN_HASH=$WIN_HASH"
          echo "    MAC_HASH=$MAC_HASH"
          echo "    LIN_HASH=$LIN_HASH"

          echo "==> Building populated manifest JSON..."
          jq -n \
            --arg version "$VERSION" \
            --arg build_id "$BUILD_ID" \
            --arg win_h "$WIN_HASH" \
            --arg mac_h "$MAC_HASH" \
            --arg lin_h "$LIN_HASH" \
            --arg pubkey "d31f43fcfba1fae04313d384d7fba026bd52796550c57def6cf47b069c18043f" \
            '{
              "comment": "Signed by ConquerD release workflow (Ed25519 project key). Build IDs and archive hashes taken from CI artifacts.",
              "releases": [
                {"version": $version, "platform": "win64", "build_hash": $win_h, "build_id": $build_id, "published_at": 0.0},
                {"version": $version, "platform": "macos-arm64", "build_hash": $mac_h, "build_id": $build_id, "published_at": 0.0},
                {"version": $version, "platform": "linux-x86_64", "build_hash": $lin_h, "build_id": $build_id, "published_at": 0.0}
              ],
              "signed_at": 0.0,
              "signer_pubkey": $pubkey
            }' > /tmp/populated.json

          echo "==> Signing manifest with project private key..."
          cargo run -p conquerd-installer --manifest-path rust/Cargo.toml --bin sign-release-manifest -- \
            -i /tmp/populated.json \
            -o releases_manifest.json \
            --private-key /tmp/release-signer-private.pem

          echo "==> Signed manifest:"
          cat releases_manifest.json

      - name: Verify the just-signed manifest against the committed public key
        if: env.RELEASE_SIGNER_PRIVATE_PEM != ''
        run: |
          cargo run -p conquerd-installer --manifest-path rust/Cargo.toml --bin sign-release-manifest -- \
            --verify -i releases_manifest.json
          echo "Manifest signature verified successfully."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: "ConquerD ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/ConquerD-*-win64.7z
            artifacts/ConquerD-*-win64.7z.sha256
            artifacts/conquerd-installer.exe
            artifacts/ConquerD-*-macos-arm64.dmg
            artifacts/ConquerD-*-macos-arm64.dmg.sha256
            artifacts/ConquerD-*-x86_64.AppImage
            artifacts/ConquerD-*-x86_64.AppImage.sha256
            artifacts/conquerd-supernode-*-linux-aarch64.tar.gz
            artifacts/conquerd-supernode-*-linux-aarch64.tar.gz.sha256
            artifacts/conquerd-supernode-*-linux-x86_64.tar.gz
            artifacts/conquerd-supernode-*-linux-x86_64.tar.gz.sha256
            artifacts/conquerd-supernode-*-win64.zip
            artifacts/conquerd-supernode-*-win64.zip.sha256
            releases_manifest.json

  publish-nightly:
    # Run for pushes to develop and scheduled nightlies.
    # Does not require the protected "release" environment or signing secrets.
    if: github.ref == 'refs/heads/develop' || github.event_name == 'schedule'
    needs: [build-windows, build-macos, build-linux, build-supernode-linux-arm64, build-supernode-linux-x86_64, build-supernode-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source (for manifest generator)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          ref: develop  # ensure we are on develop for scheduled runs

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-unsigned"  # from build-windows
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "macos-release"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "linux-release"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "supernode-linux-arm64-release"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "supernode-linux-x86_64-release"
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "supernode-win64-release"
          path: artifacts
          merge-multiple: true

      - name: Prepare nightly artifacts for upload
        run: |
          set -euo pipefail

          # upload-artifact preserves the dist/ directory from each build job,
          # so files land under artifacts/dist/ rather than artifacts/.
          echo "==> Downloaded artifact tree:"
          find artifacts -type f | sort

          mkdir -p artifacts/_staging
          find artifacts -type f \
            \( -name 'ConquerD-*' -o -name 'conquerd-installer*.exe' -o -name 'conquerd-supernode-*' \) \
            -exec cp -f {} artifacts/_staging/ \;
          rm -rf artifacts/dist
          for f in artifacts/_staging/*; do
            mv -f "$f" artifacts/
          done
          rmdir artifacts/_staging

          cd artifacts
          shopt -s nullglob
          for f in ConquerD-*-win64.7z; do mv "$f" "ConquerD-nightly-win64.7z"; done
          for f in ConquerD-*-win64.7z.sha256; do mv "$f" "ConquerD-nightly-win64.7z.sha256"; done
          [ -f "conquerd-installer.exe" ] && mv "conquerd-installer.exe" "conquerd-installer-nightly.exe"
          for f in ConquerD-*-macos-arm64.dmg; do mv "$f" "ConquerD-nightly-macos-arm64.dmg"; done
          for f in ConquerD-*-macos-arm64.dmg.sha256; do mv "$f" "ConquerD-nightly-macos-arm64.dmg.sha256"; done
          for f in ConquerD-*-x86_64.AppImage; do mv "$f" "ConquerD-nightly-x86_64.AppImage"; done
          for f in ConquerD-*-x86_64.AppImage.sha256; do mv "$f" "ConquerD-nightly-x86_64.AppImage.sha256"; done
          for f in conquerd-supernode-*-linux-aarch64.tar.gz; do mv "$f" "conquerd-supernode-nightly-linux-aarch64.tar.gz"; done
          for f in conquerd-supernode-*-linux-aarch64.tar.gz.sha256; do mv "$f" "conquerd-supernode-nightly-linux-aarch64.tar.gz.sha256"; done
          for f in conquerd-supernode-*-linux-x86_64.tar.gz; do mv "$f" "conquerd-supernode-nightly-linux-x86_64.tar.gz"; done
          for f in conquerd-supernode-*-linux-x86_64.tar.gz.sha256; do mv "$f" "conquerd-supernode-nightly-linux-x86_64.tar.gz.sha256"; done
          for f in conquerd-supernode-*-win64.zip; do mv "$f" "conquerd-supernode-nightly-win64.zip"; done
          for f in conquerd-supernode-*-win64.zip.sha256; do mv "$f" "conquerd-supernode-nightly-win64.zip.sha256"; done

          echo "==> Nightly assets ready:"
          find . -maxdepth 1 -type f | sort

          REQUIRED=(
            ConquerD-nightly-win64.7z
            ConquerD-nightly-win64.7z.sha256
            conquerd-installer-nightly.exe
            ConquerD-nightly-macos-arm64.dmg
            ConquerD-nightly-macos-arm64.dmg.sha256
            ConquerD-nightly-x86_64.AppImage
            ConquerD-nightly-x86_64.AppImage.sha256
            conquerd-supernode-nightly-linux-aarch64.tar.gz
            conquerd-supernode-nightly-linux-aarch64.tar.gz.sha256
            conquerd-supernode-nightly-linux-x86_64.tar.gz
            conquerd-supernode-nightly-linux-x86_64.tar.gz.sha256
            conquerd-supernode-nightly-win64.zip
            conquerd-supernode-nightly-win64.zip.sha256
          )
          missing=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing nightly asset: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Rust (for unsigned manifest generator)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2025-04)

      - name: Generate unsigned nightly manifest
        run: |
          set -euo pipefail

          # After the checkout step (which forces develop on schedule), get the actual commit sha
          # of the tree being built. This ensures correct build_id even for scheduled runs.
          NIGHTLY_SHA=$(git rev-parse HEAD)

          cargo run -p conquerd-installer --manifest-path rust/Cargo.toml --bin sign-release-manifest -- \
            --generate-unsigned -o /tmp/nightly-manifest.json

          # Populate with real values from the just-built artifacts (no signing for nightlies)
          WIN_SHA_FILE=$(find artifacts -name '*win64.7z.sha256' | head -1 || true)
          WIN_HASH=$( [ -n "$WIN_SHA_FILE" ] && awk '{print tolower($1)}' "$WIN_SHA_FILE" || echo "" )

          MAC_SHA_FILE=$(find artifacts -name '*macos-arm64.dmg.sha256' | head -1 || true)
          MAC_HASH=$( [ -n "$MAC_SHA_FILE" ] && awk '{print tolower($1)}' "$MAC_SHA_FILE" || echo "" )

          LIN_SHA_FILE=$(find artifacts -name '*x86_64.AppImage.sha256' | head -1 || true)
          LIN_HASH=$( [ -n "$LIN_SHA_FILE" ] && awk '{print tolower($1)}' "$LIN_SHA_FILE" || echo "" )

          # Use a date-based version for the manifest entries
          DATE=$(date -u +%Y%m%d)
          BUILD_ID="nightly-${NIGHTLY_SHA}-${{ github.run_number }}"

          jq -n \
            --arg version "nightly-$DATE" \
            --arg build_id "$BUILD_ID" \
            --arg win_h "$WIN_HASH" \
            --arg mac_h "$MAC_HASH" \
            --arg lin_h "$LIN_HASH" \
            '{
              "comment": "Development nightly build from develop branch. Not for production use. No Ed25519 signature.",
              "releases": [
                {"version": $version, "platform": "win64", "build_hash": $win_h, "build_id": $build_id, "published_at": 0.0},
                {"version": $version, "platform": "macos-arm64", "build_hash": $mac_h, "build_id": $build_id, "published_at": 0.0},
                {"version": $version, "platform": "linux-x86_64", "build_hash": $lin_h, "build_id": $build_id, "published_at": 0.0}
              ],
              "signed_at": 0.0
            }' > releases_manifest.json

          echo "Nightly manifest (unsigned):"
          cat releases_manifest.json

      - name: Create or update Nightly GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: nightly
          name: "Nightly Build ${{ github.sha }}"
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            **Development nightly build** from the `develop` branch.

            - Built on: ${{ github.event_name == 'schedule' && 'schedule' || 'push' }}
            - Commit: ${{ github.sha }}
            - Build ID in binaries: see the attached manifest or run the app with --version / check attestation.

            **Not signed** with the release key. For testing and development only.
            Use at your own risk. The `conquerd-installer` can consume these for updates (basic sha256 verification).

            Artifacts:
            - Windows portable 7z + standalone installer
            - macOS dmg
            - Linux AppImage
            - Linux ARM64 / x86_64 supernode tarballs
            - Windows x86_64 supernode zip

            The `releases_manifest.json` is unsigned and provided for reference.
          files: |
            artifacts/ConquerD-nightly-win64.7z
            artifacts/ConquerD-nightly-win64.7z.sha256
            artifacts/conquerd-installer-nightly.exe
            artifacts/ConquerD-nightly-macos-arm64.dmg
            artifacts/ConquerD-nightly-macos-arm64.dmg.sha256
            artifacts/ConquerD-nightly-x86_64.AppImage
            artifacts/ConquerD-nightly-x86_64.AppImage.sha256
            artifacts/conquerd-supernode-nightly-linux-aarch64.tar.gz
            artifacts/conquerd-supernode-nightly-linux-aarch64.tar.gz.sha256
            artifacts/conquerd-supernode-nightly-linux-x86_64.tar.gz
            artifacts/conquerd-supernode-nightly-linux-x86_64.tar.gz.sha256
            artifacts/conquerd-supernode-nightly-win64.zip
            artifacts/conquerd-supernode-nightly-win64.zip.sha256
            releases_manifest.json
