# Supply chain security checks for ConquerD
# Runs on schedule (weekly) and can be triggered manually.
# Includes:
# - cargo-deny (advisories, licenses, bans, sources)
# - cargo-audit (via official rustsec action)
#
# See deny.toml for policy.

name: Supply Chain

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: EmbarkStudios/cargo-deny-action@e2f4ede4a7b0cb2f4fe3d17c9c1c0f7d6a0f9a0e # v1 (pinned commit as of 2026)
        with:
          command: check

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Security audit (rust workspace)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2 (pinned)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

      - name: Security audit (client workspace)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2 (pinned)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust/conquerd-client

  # Note on cargo-outdated:
  # cargo-outdated is useful locally (`cargo install cargo-outdated && cargo outdated`).
  # Adding it to scheduled CI is possible but noisy; many projects run it
  # manually or via a bot. For now we document it in the runbook instead of
  # a noisy scheduled job.
